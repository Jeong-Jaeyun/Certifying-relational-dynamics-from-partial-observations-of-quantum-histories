[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-qmn"
version = "0.1.0"
description = "BI-QMN P0 mechanical correctness harness"
requires-python = ">=3.11"
dependencies = [
  "qiskit>=2.4",
  "numpy>=2.0",
  "scipy>=1.13",
  "cvxpy>=1.9",
  "mpmath>=1.3",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
